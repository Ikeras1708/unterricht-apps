<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="referrer" content="no-referrer">
<!-- Leeres Symbol: Der Browser fragt sonst beim Server nach favicon.ico. -->
<link rel="icon" href="data:,">
<title>Die Eule und die Strandmäuse</title>
<!--
  Simulationsspiel zur natürlichen Auslese an der Strandmaus, Klasse 8, UB 2 Biologie am 2026-11-19.
  Eine Datei, keine Nachladung aus dem Netz, keine Cookies, kein Ton. Gespeichert wird nur der Spielstand
  (Spielzahlen, nichts Personenbezogenes) im sessionStorage des Tabs: Er übersteht Neuladen und Zurückwischen
  und endet mit dem Tab oder mit „Neu starten“. Ist die Seite nicht zu sehen (Tab gewechselt, iPad gesperrt),
  steht die Zeit der Nacht.
  Einstellungen über die Adresse, alle optional:
    start=20        Anteil heller Mäuse zu Beginn auf Sandinsel und Festland in Prozent
    wanderung=80    Anteil heller Mäuse zu Beginn der Wanderung in Prozent
    naechte=5       Zahl der Nächte je Boden
    fang=10         Mäuse, die die Eule je Nacht fängt
    zeit=20         Sekunden je Nacht
    tarnung=0.45    0 bis 1: wie nah das Fell an der Bodenfarbe liegt (Feinabstimmung für den Probelauf)
    fangfaktor=0.2  Automatik und Testrechnung: Fangchance einer getarnten Maus im Verhältnis zu einer auffälligen
    auto=1          die Eule jagt von selbst (Beamer, Lernende, die nicht tippen können)
    auto=2          Selbstlauf für den Beamer: wie auto=1, dazu laufen nach dem ersten Tipp alle Nächte, die Sandinsel
                    und das Festland ohne weiteren Tipp bis zum Vergleich
    halt=0          Halt nach Nacht 1 auf der Sandinsel: Der Knopf „Nächste Nacht“ ist so viele Sekunden gesperrt
                    (Standard 0: kein Halt; mit auto gibt es keinen Halt)
    stern=1         Stern-Aufgabe: Das Spiel beginnt mit der Wanderung; nur dann gibt es die Wanderung
    lehrkraft=1     Knopf „Lehrkraft“: gemessene Fangquote, Automatik für eine Nacht, Testrechnung
-->
<style>
:root{
  --nacht:#1d2440; --text:#1f2328; --text2:#4a4f57; --linie:#c9ccd3;
  --knopf:#2b3a7a; --sand:#a8741c; --wald:#5a3d22; --wander:#2f6f8f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--nacht);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
body{overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom)}
.ohne-js{position:absolute;top:0;left:0;right:0;z-index:9;padding:24px;background:var(--nacht);color:#fff;font-size:22px;line-height:1.4}
header{flex:0 0 auto;min-height:60px;padding:env(safe-area-inset-top) 12px 0 12px;background:var(--nacht);color:#fff;
  display:flex;align-items:center;justify-content:space-between;font-size:19px}
header>div{margin-right:10px}
#k-ort{font-weight:700;white-space:nowrap}
#k-fang{white-space:nowrap}
#k-zeit{min-width:110px;white-space:nowrap}
#k-balken{height:6px;background:rgba(255,255,255,.25);border-radius:3px;margin-top:4px;overflow:hidden;display:none}
#k-balken div{height:100%;width:100%;background:#f3e9b5}
.kopf-rechts{display:flex;align-items:center;margin-right:0}
button{font-family:inherit}
.klein{min-height:44px;padding:6px 14px;font-size:16px;border-radius:10px;border:2px solid rgba(255,255,255,.7);
  background:transparent;color:#fff;margin-left:8px;white-space:nowrap}
#feld{position:relative;flex:1 1 auto;overflow:hidden;touch-action:none;background:#555}
#boden{position:absolute;top:0;left:0}
#maeuse{position:absolute;top:0;left:0;display:block}
#nacht{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;opacity:0;transition:opacity 1s;
  background:radial-gradient(ellipse at 25% 10%,rgba(40,50,90,.08) 0%,rgba(12,18,48,.30) 60%,rgba(8,12,36,.40) 100%)}
#nacht.an{opacity:1}
#nacht.morgen{opacity:.2}
#hinweis{position:absolute;left:50%;top:14px;-webkit-transform:translateX(-50%);transform:translateX(-50%);
  max-width:90%;background:rgba(20,24,48,.9);color:#fff;font-size:20px;line-height:1.3;padding:10px 18px;
  border-radius:12px;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center}
#hinweis.an{opacity:1}
#morgen{position:absolute;right:12px;top:12px;bottom:12px;width:330px;background:rgba(255,255,255,.97);
  border-radius:14px;padding:16px 18px 0 18px;box-shadow:0 4px 18px rgba(0,0,0,.35);overflow-y:auto;display:none;
  -webkit-overflow-scrolling:touch}
#morgen.an{display:block}
/* Der Knopf der Morgen-Karte bleibt am unteren Rand sichtbar, auch wenn die Karte länger ist als der Bildschirm. */
#morgen .fuss{position:-webkit-sticky;position:sticky;bottom:0;background:#fff;margin:0 -18px;padding:0 18px 16px 18px;
  border-radius:0 0 14px 14px}
#morgen .halt{margin:0;padding-top:8px}
#morgen:focus,.karte:focus{outline:none}
.scroll{overscroll-behavior:contain}
@media (orientation:portrait){
  #morgen{left:12px;right:12px;top:auto;width:auto;max-height:60%}
}
@media (max-width:860px){
  header{font-size:16px;padding-left:8px;padding-right:8px}
  header>div{margin-right:6px}
  #k-zeit{min-width:84px}
  .klein{font-size:14px;padding:6px 9px;margin-left:5px}
}
#schirm{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(15,20,40,.35);display:none;
  overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 14px}
#schirm.an{display:block}
.karte{background:#fff;border-radius:16px;padding:22px 24px;max-width:560px;margin:10px auto;
  box-shadow:0 6px 24px rgba(0,0,0,.35);font-size:19px;line-height:1.4}
.karte.breit{max-width:900px}
h1{font-size:27px;margin:0 0 12px 0;line-height:1.2}
h2{font-size:23px;margin:0 0 8px 0}
p{margin:8px 0}
.gross{font-size:22px}
.riesig{font-size:40px;line-height:1.1}
ol.schritte{padding-left:26px;margin:10px 0}
ol.schritte li{margin:6px 0}
.knopf{display:inline-block;min-height:54px;padding:12px 24px;font-size:21px;font-weight:600;border:2px solid var(--knopf);
  border-radius:12px;background:var(--knopf);color:#fff;margin:10px 10px 0 0}
.knopf.zweit{background:#fff;color:var(--knopf)}
.knopf[disabled]{background:#7f8590;border-color:#7f8590;color:#fff;-webkit-text-fill-color:#fff;opacity:1}
/* Die Knöpfe einer Karte bleiben am unteren Rand sichtbar, auch wenn die Karte länger ist als der Bildschirm. */
.karte .fuss{position:-webkit-sticky;position:sticky;bottom:0;background:#fff;margin:0 -24px -22px -24px;
  padding:0 24px 22px 24px;border-radius:0 0 16px 16px}
.tab{border-collapse:collapse;font-size:19px;margin:8px 0}
.tab th,.tab td{border:1px solid var(--linie);padding:5px 12px;text-align:center}
.tab th{background:#f1f2f5}
.tab tr.neu td{background:#fff1c2;font-weight:700}
.tab .trenn{border-left:3px solid #9aa0aa}
.tab th[colspan]{font-size:16px;font-weight:600;white-space:normal;max-width:9em}
.tab th,.tab td{white-space:nowrap}
.mit-fang th,.mit-fang td{padding:5px 8px}
.spalten{display:flex;flex-wrap:wrap;align-items:flex-start}
.spalten>div{flex:1 1 300px;margin:0 12px 8px 0}
.spalten>div.tab-spalte{flex:0 0 auto}
.vergleich .tab{font-size:16px}
.vergleich .tab th,.vergleich .tab td{padding:3px 8px}
/* Vergleich mit drei Böden (nach der Wanderung): breitere Karte, schmalere Spalten, alle drei in einer Zeile. */
.karte.drei{max-width:1140px}
.drei .spalten>div{flex:1 1 240px;margin-right:10px}
.drei .tab th,.drei .tab td{padding:3px 6px}
.diagramm{width:100%;height:auto;display:block}
.punkt{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid #555;vertical-align:-2px;margin-right:4px}
.eule-bild{float:right;margin:0 0 6px 12px}
.hinweis-klein{font-size:16px;color:var(--text2)}
#lk-panel{position:absolute;left:10px;bottom:10px;width:540px;max-width:94%;max-height:75%;overflow-y:auto;
  background:#fff;border-radius:12px;padding:14px 16px;box-shadow:0 4px 18px rgba(0,0,0,.4);font-size:15px;
  line-height:1.4;display:none;z-index:5;-webkit-overflow-scrolling:touch}
#lk-panel.an{display:block}
#lk-panel h3{margin:0 0 6px 0;font-size:17px}
#lk-panel .knopf{font-size:16px;min-height:44px;padding:8px 14px}
#lk-panel table{border-collapse:collapse;margin:4px 0}
#lk-panel td,#lk-panel th{border:1px solid var(--linie);padding:2px 6px;text-align:center}
code{font-size:14px;background:#f1f2f5;padding:1px 4px;border-radius:4px;-webkit-user-select:text;user-select:text}
/* Safari im Querformat lässt unter seinen Leisten weniger Höhe: Die Karten rücken enger zusammen, der Inhalt bleibt gleich. */
@media (orientation:landscape) and (max-height:780px){
  #schirm{padding:8px 14px}
  .karte{margin:4px auto;padding:14px 20px;font-size:18px;line-height:1.35}
  .karte .fuss{margin:0 -20px -14px -20px;padding:0 20px 14px 20px}
  .karte h1{font-size:24px;margin-bottom:6px}
  .karte p{margin:5px 0}
  .karte .gross{font-size:20px}
  .karte .riesig{font-size:32px}
  .karte .tab{margin:4px 0}
  .karte:not(.vergleich) .tab{font-size:17px}
  .karte:not(.vergleich) .tab th,.karte:not(.vergleich) .tab td{padding:2px 9px}
  .karte .diagramm{max-height:215px}
  .karte .knopf{min-height:48px;padding:9px 22px;margin-top:6px}
}
/* Etwas mehr Höhe (Vollbild im Querformat): nur die Ränder um die Karte werden schmaler. */
@media (orientation:landscape) and (min-height:781px) and (max-height:860px){
  #schirm{padding:8px 14px}
  .karte{margin:2px auto}
}
/* Hochformat: Tabelle und Diagramm stehen untereinander, das Diagramm bleibt deshalb niedriger. */
@media (orientation:portrait){
  #schirm{padding:8px 14px}
  .karte{margin:2px auto}
  .karte p{margin:6px 0}
  .karte:not(.vergleich) .diagramm{max-height:230px}
}
/* Läuft eine Karte trotzdem über, verläuft der Text weich unter dem festen Fuß. */
.fuss::before{content:"";position:absolute;left:0;right:0;top:-12px;height:12px;pointer-events:none;
  background:linear-gradient(rgba(255,255,255,0),#fff)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="k-ort">Strandmäuse</div>
    <div id="k-fang"></div>
    <div id="k-zeit"><span id="k-zeit-text"></span><div id="k-balken" aria-hidden="true"><div></div></div></div>
    <div class="kopf-rechts">
      <button id="lk" class="klein" hidden>Lehrkraft</button>
      <button id="neu" class="klein" data-los="neu">Neu starten</button>
    </div>
  </header>
  <div id="feld">
    <noscript><div class="ohne-js">Das Spiel startet hier nicht. Öffne die Adresse in Safari.</div></noscript>
    <canvas id="boden" aria-hidden="true"></canvas>
    <svg id="maeuse" role="img" aria-label="Spielfeld von oben mit hellen und braunen Mäusen" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
      <defs id="defs"></defs>
      <g id="schicht"></g>
      <g id="effekte"></g>
    </svg>
    <div id="nacht"></div>
    <div id="hinweis" role="status" aria-live="polite"></div>
    <div id="morgen" class="scroll" role="region" aria-label="Morgen: Zahlen nach der Nacht"></div>
    <div id="schirm" class="scroll"></div>
    <div id="lk-panel" class="scroll"></div>
  </div>
</div>
<script>
(function () {
  'use strict';

  // ---------- Einstellungen ----------
  var Q = new URLSearchParams(location.search);
  function zahl(name, def, min, max) {
    var v = parseFloat((Q.get(name) || '').replace(',', '.'));
    if (isNaN(v)) return def;
    return Math.min(max, Math.max(min, v));
  }
  var N = 30;
  var CFG = {
    start: zahl('start', 20, 0, 100),
    wanderung: zahl('wanderung', 80, 0, 100),
    naechte: Math.round(zahl('naechte', 5, 1, 10)),
    fang: Math.round(zahl('fang', 10, 1, 20)),
    zeit: Math.round(zahl('zeit', 20, 5, 120)),
    tarnung: zahl('tarnung', 0.45, 0, 1),
    fangfaktor: zahl('fangfaktor', 0.2, 0, 1),
    auto: Q.get('auto') === '1' || Q.get('auto') === '2',
    selbst: Q.get('auto') === '2',
    halt: Math.round(zahl('halt', 0, 0, 600)),
    stern: Q.get('stern') === '1',
    lehrkraft: Q.get('lehrkraft') === '1'
  };

  // ---------- Farben ----------
  function hexRgb(h) { h = h.replace('#', ''); return [0, 2, 4].map(function (i) { return parseInt(h.substr(i, 2), 16); }); }
  function rgbHex(c) {
    return '#' + c.map(function (v) { v = Math.max(0, Math.min(255, Math.round(v))); return (v < 16 ? '0' : '') + v.toString(16); }).join('');
  }
  function mix(a, b, t) { var x = hexRgb(a), y = hexRgb(b); return rgbHex([0, 1, 2].map(function (i) { return x[i] + (y[i] - x[i]) * t; })); }

  var SAND = '#ebe2cd', WALD = '#4e3a28';
  // Kein Tier ändert je seine Farbe: Die beiden Fellfarben stehen für das ganze Spiel fest.
  // Die braune Maus liegt auf dem dunklen Boden des Festlands schwächer an der Bodenfarbe, sonst ist sie im Halbdunkel kaum zu finden.
  var FELL = { hell: mix('#d2bd96', SAND, CFG.tarnung), braun: mix('#8c6540', WALD, CFG.tarnung * 0.6) };

  var BOEDEN = {
    // Linienfarbe für alle Böden gleich: Die Linie zeigt immer den Anteil heller Mäuse, nicht die Bodenfarbe.
    sand: { name: 'Sandinsel', boden: 'sand', farbe: '#2b3a7a', anteil: function () { return CFG.start; } },
    wald: { name: 'Festland', boden: 'wald', farbe: '#2b3a7a', anteil: function () { return CFG.start; } },
    wanderung: { name: 'Wanderung', boden: 'wald', farbe: '#2b3a7a', anteil: function () { return CFG.wanderung; } }
  };
  function startHell(art) { return Math.round(N * BOEDEN[art].anteil() / 100); }

  // ---------- Hilfen ----------
  var NS = 'http://www.w3.org/2000/svg', XL = 'http://www.w3.org/1999/xlink';
  function $(id) { return document.getElementById(id); }
  function zufall(n) { return Math.floor(Math.random() * n); }
  function jetzt() { return (window.performance && performance.now) ? performance.now() : Date.now(); }
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  // Karten ein- und ausblenden. Die Klasse „scroll“ bleibt immer stehen: Nur in Elementen mit dieser Klasse
  // lässt der touchmove-Wächter unten das Wischen zu.
  function zeige(id, an) { $(id).className = an ? 'scroll an' : 'scroll'; }
  function fokus(e) {
    if (!e || !e.focus) return;
    try { e.setAttribute('tabindex', '-1'); e.focus({ preventScroll: true }); } catch (x) { /* Fokus ist nur eine Hilfe */ }
  }
  function animiere(dauer, schritt, fertig) {
    var t0 = jetzt();
    function f() {
      var k = Math.max(0, Math.min(1, (jetzt() - t0) / dauer));
      schritt(k);
      if (k < 1) requestAnimationFrame(f); else if (fertig) fertig();
    }
    requestAnimationFrame(f);
  }
  function zaehlen(liste) {
    var h = 0;
    liste.forEach(function (f) { if (f === 'hell') h++; });
    return { h: h, b: liste.length - h };
  }
  function prozent(z) { return Math.round(z.h / (z.h + z.b) * 100); }
  function gen(n) { return n === 1 ? '1 Generation' : n + ' Generationen'; }
  function klasse(h) {
    var p = h / N * 100;
    if (p < 25) return 'unter 25 %';
    if (p <= 50) return '25 bis 50 %';
    if (p <= 75) return 'über 50 bis 75 %';
    return 'über 75 %';
  }

  // ---------- Zustand ----------
  var W = 0, H = 0, L = 30, HIT = 25;
  var S;
  var QUOTE = {}; // gemessene Fangquote, bleibt beim Neustart erhalten
  var GESPIELT = 0; // gespielte Nächte seit dem Laden: ab der zweiten Nacht kürzere Pausen
  function neuerZustand() {
    var alt = S ? S.tok : 0;
    S = {
      tok: alt + 1, boden: null, vorschau: 'sand', reihen: {}, fang: {}, nacht: 0, maeuse: [], bestand: [],
      gefangen: 0, laeuft: false, morgen: false, ende: 0, timer: null, autoTimer: null, nq: null, bodenGemalt: null,
      frei: 0, pause: false, rest: 0, ansicht: '', haltBis: 0, haltFertig: false
    };
  }

  // ---------- Halt nach Nacht 1 ----------
  // Auf der Sandinsel bleibt „Nächste Nacht“ nach der ersten Nacht einige Sekunden gesperrt: In dieser Zeit werden die
  // iPads umgedreht und die Zahlen gemeinsam eingetragen. Gemessen wird an der Uhr, nicht an Zeitgebern: Ein gesperrtes
  // iPad zählt weiter, Neuladen verkürzt und verlängert den Halt nicht. Je Spiel gibt es den Halt einmal.
  var haltTimer = null;
  function haltOffen() {
    return CFG.halt > 0 && !CFG.auto && S.boden === 'sand' && S.nacht === 1 && CFG.naechte > 1 && !S.haltFertig;
  }
  function haltPruefen() {
    if (!S.haltBis) { clearInterval(haltTimer); return; }
    if (Date.now() < S.haltBis) return;
    haltEnde();
  }
  function haltEnde() {
    clearInterval(haltTimer);
    if (!S.haltBis) return;
    S.haltBis = 0; S.haltFertig = true;
    if (S.morgen && S.ansicht === 'morgen') zeigeMorgen();
    lkAuffrischen();
  }

  // ---------- Selbstlauf (auto=2) ----------
  // Geht nach einer Pause von selbst weiter, solange dieselbe Ansicht steht und niemand getippt hat.
  var selbstNr = 0;
  function selbst(ms, ansicht, weiterMit) {
    if (!CFG.selbst) return;
    var tok = S.tok, nr = ++selbstNr;
    setTimeout(function () { if (tok === S.tok && nr === selbstNr && S.ansicht === ansicht) weiterMit(); }, ms);
  }

  // ---------- Maße ----------
  function masse() {
    var f = $('feld');
    W = f.clientWidth; H = f.clientHeight;
    L = Math.max(26, Math.min(38, Math.round(Math.min(W, H) * 0.045)));
    HIT = Math.max(24, Math.round(L * 0.8)); // Tippfläche mindestens 48 px Durchmesser
    var svg = $('maeuse');
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.setAttribute('width', W); svg.setAttribute('height', H);
  }

  // ---------- Boden ----------
  function malBoden(art) {
    var c = $('boden'), dpr = Math.min(window.devicePixelRatio || 1, 2);
    c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
    c.style.width = W + 'px'; c.style.height = H + 'px';
    var g = c.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    var r = rng(art === 'sand' ? 11 : 23), i, n, x, y, rad, grd, s, a, rx, ry, farben;
    function wahl(l) { return l[Math.floor(r() * l.length)]; }
    if (art === 'sand') {
      g.fillStyle = SAND; g.fillRect(0, 0, W, H);
      for (i = 0; i < 40; i++) {
        x = r() * W; y = r() * H; rad = 60 + r() * 160;
        grd = g.createRadialGradient(x, y, 0, x, y, rad);
        grd.addColorStop(0, r() < 0.5 ? 'rgba(255,252,244,0.35)' : 'rgba(214,200,170,0.28)');
        grd.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = grd; g.fillRect(x - rad, y - rad, 2 * rad, 2 * rad);
      }
      g.lineCap = 'round';
      n = Math.round(W * H / 9000);
      for (i = 0; i < n; i++) {
        x = r() * W; y = r() * H; s = 40 + r() * 120;
        g.strokeStyle = 'rgba(190,172,135,' + (0.12 + r() * 0.12).toFixed(2) + ')';
        g.lineWidth = 1.5 + r() * 2.5;
        g.beginPath(); g.moveTo(x, y);
        g.bezierCurveTo(x + s * 0.3, y - 6 + r() * 12, x + s * 0.7, y - 6 + r() * 12, x + s, y + (r() - 0.5) * 10);
        g.stroke();
      }
      farben = ['#f8f3e8', '#e0d3b8', '#efe6d3', '#d6c7a8', '#fbf8f1', '#e8dcc3'];
      n = Math.round(W * H / 22);
      for (i = 0; i < n; i++) {
        g.fillStyle = wahl(farben); g.globalAlpha = 0.5 + r() * 0.5; s = 0.8 + r() * 1.6;
        g.fillRect(r() * W, r() * H, s, s);
      }
      g.globalAlpha = 1;
      // helle Steinchen und Muschelreste in Mausgröße
      n = Math.round(W * H / 9000);
      for (i = 0; i < n; i++) {

    }

  // ---------- Testrechnung (wie im Spiel, ohne Bild) ----------
  function simLauf(f, h0) { // f: Fangfaktor der getarnten Farbe, h0: Zahl der getarnten Mäuse zu Beginn
    var h = h0, b = N - h0, n, k;
    for (n = 0; n < CFG.naechte; n++) {
      for (k = 0; k < CFG.fang; k++) {
        if (h + b === 0) break;
        var w = h * f + b;
        if ((w === 0 && h > 0) || (w > 0 && Math.random() < h * f / w)) h--; else b--;
      }
      // Jedes Junge erbt die Farbe eines zufällig gewählten Überlebenden: Anteil der Überlebenden vor den Geburten festhalten
      var s = h + b, p = h / s;
      for (k = 0; k < N - s; k++) { if (Math.random() < p) h++; else b++; }
    }
    return h;
  }
  function testrechnung(art, laeufe, f) {
    var h0 = startHell(art), sand = BOEDEN[art].boden === 'sand', erg = [];
    for (var i = 0; i < laeufe; i++) {
      erg.push(sand ? simLauf(f, h0) : N - simLauf(f, N - h0));
    }
    erg.sort(function (a, b) { return a - b; });
    var kl = { 'unter 25 %': 0, '25 bis 50 %': 0, 'über 50 bis 75 %': 0, 'über 75 %': 0 };
    erg.forEach(function (h) { kl[klasse(h)]++; });
    return { median: Math.round(erg[Math.floor(laeufe / 2)] / N * 100), kl: kl, n: laeufe };
  }

  // ---------- Lehrkraft ----------
  var lkTest = '';
  // Gemessener Faktor nach Manly: ln(überlebender Anteil der getarnten) / ln(überlebender Anteil der auffälligen),
  // über die gespielten Nächte summiert. Der Quotient der Fangraten wäre verzerrt, weil die Eule je Nacht ein Drittel
  // frisst (Simulation am Spielmodell, f = 0,3: Quotient im Median 0,39, Manly 0,30).
  function gemessen(art) {
    var q = QUOTE[art];
    if (!q || !q.naechte) return null;
    var sand = BOEDEN[art].boden === 'sand';
    var lg = sand ? q.lnH : q.lnB, la = sand ? q.lnB : q.lnH;
    return la < 0 ? Math.max(0, lg / la) : null;
  }

      q.bGef + ' von ' + q.bDa + ' (' + Math.round(rb * 100) + ' %)</td><td><b>' + (f === null ? '–' : komma(f, 2)) + '</b></td></tr>';
  }

  // ---------- Spielstand im Tab (sessionStorage) ----------
  // Nur Spielzahlen. Gesichert wird an jedem Bildschirmwechsel; eine angefangene Nacht beginnt nach Neuladen neu.
  var SPEICHER = 'strandmaus-spiel-1', SPEICHER_Q = 'strandmaus-quote-1';
  function speicher() { try { return window.sessionStorage || null; } catch (e) { return null; } }
  function sichern(ansicht) {
    S.ansicht = ansicht;
    var sp = speicher();
    if (!sp) return;
    try {
      sp.setItem(SPEICHER, JSON.stringify({
        adresse: location.search, ansicht: ansicht, art: S.boden || S.vorschau, nacht: S.nacht,
        bestand: S.bestand, reihen: S.reihen, fang: S.fang, halt: S.haltFertig, haltBis: S.haltBis
      }));
    } catch (e) { /* Speicher voll oder gesperrt: Spiel läuft ohne Sicherung weiter */ }
  }
  function quoteSichern() {
    var sp = speicher();
    if (!sp) return;
    try { sp.setItem(SPEICHER_Q, JSON.stringify({ adresse: location.search, quote: QUOTE })); } catch (e) { /* ohne Sicherung */ }
  }
  function vergessen() {
    var sp = speicher();
    if (!sp) return;
    try { sp.removeItem(SPEICHER); } catch (e) { /* nichts zu tun */ }
  }
  function lies(sp, schluessel) {
    try { return JSON.parse(sp.getItem(schluessel) || 'null'); } catch (e) { return null; }
  }
  // Ein Spielstand zählt nur, wenn jede Zeile zwei Zahlen mit der Summe 30 hat; alles andere führt zum Neuanfang.
  function reiheGueltig(r) {
    return Array.isArray(r) && r.length > 0 && r.length <= CFG.naechte + 1 && r.every(function (z) {
      return z && typeof z.h === 'number' && typeof z.b === 'number' && z.h >= 0 && z.b >= 0 && z.h + z.b === N;
    });
  }
  function standGueltig(d) {
    if (!d || d.adresse !== location.search || typeof d.ansicht !== 'string' || !d.reihen || typeof d.reihen !== 'object') return false;
    if (d.fang && typeof d.fang !== 'object') return false;
    return Object.keys(d.reihen).every(function (a) {
      var f = d.fang ? d.fang[a] : null;
      return BOEDEN[a] && reiheGueltig(d.reihen[a]) && (!f || (Array.isArray(f) && f.every(function (z) {
        return z && typeof z.h === 'number' && typeof z.b === 'number';
      })));
    });
  }
  function wiederherstellen() {
    try { return stelleHer(); } catch (e) { return false; }
  }
  function stelleHer() {
    var sp = speicher();
    if (!sp) return false;
    var q = lies(sp, SPEICHER_Q), d = lies(sp, SPEICHER);
    if (q && q.adresse === location.search && q.quote && typeof q.quote === 'object') QUOTE = q.quote;
    if (!standGueltig(d)) return false;
    S.reihen = d.reihen; S.fang = d.fang || {};
    Object.keys(S.reihen).forEach(function (a) { if (!S.fang[a]) S.fang[a] = []; });
    GESPIELT = Object.keys(S.reihen).length ? 1 : 0;
    // Halt nach Nacht 1: erledigt, wenn er vor dem Neuladen zu Ende war oder inzwischen abgelaufen ist; sonst läuft er weiter.
    S.haltFertig = d.halt === true;
    if (typeof d.haltBis === 'number' && d.haltBis > 0) {
      if (d.haltBis > Date.now() && d.haltBis <= Date.now() + CFG.halt * 1000) S.haltBis = d.haltBis;
      else S.haltFertig = true;
    }
    var art = d.art;
    if (d.ansicht === 'intro' && BOEDEN[art]) { intro(art); return true; }
    if (d.ansicht === 'vergleich') {
      if (!S.reihen.sand || S.reihen.sand.length < 2) return false;
      malBoden('wald'); vergleich(); return true;
    }
    if (!BOEDEN[art] || !S.reihen[art] || S.reihen[art].length < 2) return false;
    S.boden = art; S.vorschau = art;
    malBoden(BOEDEN[art].boden);
    if (d.ansicht === 'ergebnis') { ergebnis(); return true; }
    if (d.ansicht === 'morgen' && d.nacht === S.reihen[art].length - 1 && Array.isArray(d.bestand) && d.bestand.length === N &&
        zaehlen(d.bestand).h === S.reihen[art][d.nacht].h) {
      S.nacht = d.nacht; S.bestand = d.bestand; S.morgen = true; S.laeuft = false;
      var f = S.fang[art][S.nacht - 1] || { h: 0, b: 0 };
      S.gefangen = f.h + f.b;
      S.maeuse = S.bestand.map(function (fa) { return { farbe: fa, jung: false, gefangen: false }; });
      verteile(S.maeuse); malMaeuse();
      $('nacht').className = 'morgen';
      kopf(); zeigeMorgen();
      return true;
    }
    return false;
  }

  // ---------- Neustart ----------
  // Zwei getrennte Tipps: Der zweite zählt erst nach 0,6 s (ein versehentlicher Doppeltipp löscht nichts) und bis 4 s.
  var neuZeit = 0, neuTimer = null;
  function neuKnopf(knopf) {
    var seit = Date.now() - neuZeit;
    if (seit < 600) return;
    if (seit < 4000) {
      neuZeit = 0;
      clearTimeout(neuTimer);
      clearInterval(S.timer); clearInterval(S.autoTimer);
      $('neu').textContent = 'Neu starten';
      vergessen();
      neuerZustand();
      intro('sand');
      return;
    }
    neuZeit = Date.now();
    knopf.textContent = 'Sicher? Noch einmal tippen';
    clearTimeout(neuTimer);
    neuTimer = setTimeout(function () { knopf.textContent = 'Neu starten'; }, 4000);
  }

  // ---------- Ereignisse ----------
  var EV = window.PointerEvent ? 'pointerdown' : 'touchstart';
  // Fehltipp: kurze Sperre, damit wildes Tippen nicht zufällig getarnte Mäuse fängt.
  var SPERRE = 700, sperreBis = 0;
  function daneben(e) {
    var r = $('maeuse').getBoundingClientRect();
    var p = e.touches && e.touches[0] ? e.touches[0] : e;
    var x = p.clientX - r.left, y = p.clientY - r.top;
    var c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', x.toFixed(1)); c.setAttribute('cy', y.toFixed(1));
    c.setAttribute('fill', 'none'); c.setAttribute('stroke', '#ffffff'); c.setAttribute('stroke-width', '3');
    $('effekte').appendChild(c);
    animiere(SPERRE, function (k) {
      c.setAttribute('r', (8 + 22 * k).toFixed(1));
      c.setAttribute('opacity', (0.8 * (1 - k)).toFixed(3));
    }, function () { if (c.parentNode) c.parentNode.removeChild(c); });
  }
  $('maeuse').addEventListener(EV, function (e) {
    if (!S.laeuft || CFG.auto) return;
    e.preventDefault();
    // Die ersten 0,4 s einer Nacht zählen nicht: Der zweite Tipp eines Doppeltipps auf „Nächste Nacht“ landet sonst im Feld.
    if (Date.now() < sperreBis || Date.now() < S.frei) return;
    var t = e.target;
    while (t && t !== this && !(t.getAttribute && t.getAttribute('class') === 'maus')) t = t.parentNode;
    if (t && t._maus) fange(t._maus);
    else { sperreBis = Date.now() + SPERRE; daneben(e); }
  });
  var klickBis = 0;
  document.addEventListener('click', function (e) {
    var t = e.target;
    while (t && t !== document && !(t.getAttribute && t.getAttribute('data-los'))) t = t.parentNode;
    if (!t || t === document) return;
    var los = t.getAttribute('data-los');
    if (los === 'neu') { neuKnopf(t); return; }
    // Doppeltipp: Der zweite Tipp trifft sonst einen Knopf der nächsten Karte.
    if (Date.now() < klickBis) return;
    klickBis = Date.now() + 350;
    if (los.indexOf('lk-') !== 0) selbstNr++; // ein Tipp auf einen Spielknopf geht dem Selbstlauf vor
    if (los === 'spiel-sand') bodenStart('sand');
    else if (los === 'spiel-wald') bodenStart('wald');
    else if (los === 'spiel-wanderung') bodenStart('wanderung');
    else if (los === 'intro-wald') intro('wald');
    else if (los === 'intro-wanderung') intro('wanderung');
    else if (los === 'vergleich') vergleich();
    else if (los === 'weiter') weiter();
    else if (los === 'lk-auto') { if (S.laeuft) { S.nq.auto = true; autoStart(); } }
    else if (los === 'lk-halt') { haltEnde(); lkAuffrischen(); }
    else if (los === 'lk-test') lkTestAnzeigen();
    else if (los === 'lk-zu') zeige('lk-panel', false);
  });
  if (CFG.lehrkraft) {
    $('lk').hidden = false;
    $('lk').addEventListener('click', function () {
      var p = $('lk-panel');
      zeige('lk-panel', p.className.indexOf('an') < 0);
      lkAuffrischen();
    });
  }
  // Kein Zoomen, kein Ziehen der Seite, kein Neuladen durch Herunterziehen
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('touchmove', function (e) {
    var t = e.target;
    while (t && t !== document) {
      if (t.className && typeof t.className === 'string' && t.className.indexOf('scroll') >= 0) return;
      t = t.parentNode;
    }
    e.preventDefault();
  }, { passive: false });
  var rz = null;
  window.addEventListener('resize', function () {
    clearTimeout(rz);
    rz = setTimeout(function () {
      masse();
      if (S.bodenGemalt) { var b = S.bodenGemalt; S.bodenGemalt = null; malBoden(b); }
      if (S.laeuft) entzerre();
      malMaeuse();
    }, 150);
  });

  // ---------- Start ----------
  $('defs').innerHTML = mausGruppe('m-hell', FELL.hell) + mausGruppe('m-braun', FELL.braun);
  neuerZustand();
  masse();
  if (!wiederherstellen()) { vergessen(); neuerZustand(); intro(CFG.stern ? 'wanderung' : 'sand'); }
})();
</script>
</body>
